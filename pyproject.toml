[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-voice-ai"
version = "0.1.0"
description = "On-device wake word, microphone capture, and speaker playback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
# openWakeWord is the spoken-word swap for the reference model. It is not
# required to run the on-device path or the tests.
wake = ["openwakeword>=0.6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
hardware-voice-ai = "hardware_voice_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
